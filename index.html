<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Управление МТО – ГБУ Жилищник района Кунцево</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       СТИЛИ (полная копия)
       ============================================================ */
    :root {
      --primary: #1976d2;
      --bg: #eef3f8;
      --card: #ffffff;
      --text: #263238;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      --radius: 16px;
      --transition: 0.3s ease;
    }
    .mto-dark {
      --bg: #1a1a2e;
      --card: #2d2d44;
      --text: #eee;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
      transition: background var(--transition), color var(--transition);
    }
    .mto-loader {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg); display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 9999;
      transition: opacity 0.5s;
    }
    .mto-loader .spinner {
      width: 48px; height: 48px;
      border: 5px solid rgba(0,0,0,0.1);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .mto-loader p { margin-top: 16px; font-size: 18px; color: var(--text); }

    .mto-nav {
      position: sticky; top: 0;
      background: var(--card);
      box-shadow: 0 2px 16px rgba(0,0,0,0.06);
      padding: 12px 20px; z-index: 100;
      display: flex; flex-wrap: wrap; gap: 8px 16px;
      align-items: center; justify-content: center;
    }
    .mto-nav a {
      color: var(--text); text-decoration: none;
      font-weight: 600; padding: 6px 14px;
      border-radius: 30px; transition: var(--transition);
      font-size: 14px; cursor: pointer; white-space: nowrap;
    }
    .mto-nav a:hover, .mto-nav a:focus {
      background: var(--primary); color: #fff;
    }

    .mto-section {
      padding: 60px 20px; max-width: 1400px; margin: 0 auto;
      display: none;
    }
    .mto-section.active { display: block; }
    .mto-section h2 {
      font-size: 36px; margin-bottom: 30px;
      color: var(--primary); text-align: center; font-weight: 700;
    }

    .mto-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
    }
    .mto-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 25px;
      box-shadow: var(--shadow);
      transition: var(--transition);
    }
    .mto-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.12);
    }
    .mto-card h3 { font-size: 20px; margin-bottom: 12px; color: var(--text); }
    .mto-card p, .mto-card li { font-size: 15px; color: var(--text); opacity: 0.9; }
    .mto-card ul { list-style: none; padding: 0; }
    .mto-card ul li { padding: 4px 0; border-bottom: 1px solid rgba(0,0,0,0.05); }

    .mto-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 20px; margin-top: 30px;
    }
    .mto-stat {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px; text-align: center;
      box-shadow: var(--shadow);
    }
    .mto-stat h1 { font-size: 42px; color: var(--primary); font-weight: 700; }
    .mto-stat p { font-size: 16px; opacity: 0.8; }

    .mto-chart-container { height: 280px; margin: 16px 0; }
    .mto-map { height: 500px; border-radius: var(--radius); overflow: hidden; background: var(--card); }
    .mto-3d { height: 500px; border-radius: var(--radius); overflow: hidden; background: var(--card); }

    .mto-progress { height: 12px; background: #e0e0e0; border-radius: 20px; overflow: hidden; margin-top: 8px; }
    .mto-progress-bar { height: 100%; background: var(--primary); transition: width 0.5s; }

    .mto-kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 15px;
    }
    .mto-kpi-item {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px; text-align: center;
      box-shadow: var(--shadow);
    }
    .mto-kpi-item h4 { font-size: 14px; opacity: 0.7; margin-bottom: 4px; }
    .mto-kpi-item .value { font-size: 28px; font-weight: 700; color: var(--primary); }

    .mto-notif {
      position: fixed; bottom: 20px; right: 20px;
      width: 320px; max-height: 400px; overflow-y: auto;
      z-index: 9998; display: flex; flex-direction: column; gap: 8px;
    }
    .mto-notif-item {
      background: var(--card); padding: 12px 16px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      border-left: 4px solid var(--primary);
      font-size: 14px;
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(40px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .mto-search {
      padding: 10px 18px; border-radius: 30px;
      border: 1px solid #ccc; background: var(--card);
      color: var(--text); width: 100%; max-width: 320px;
      font-size: 14px;
    }
    .mto-theme-btn {
      background: var(--card); border: 1px solid #ccc;
      border-radius: 30px; padding: 8px 18px;
      cursor: pointer; font-size: 14px;
      box-shadow: var(--shadow); transition: var(--transition);
    }
    .mto-theme-btn:hover {
      background: var(--primary); color: #fff;
      border-color: var(--primary);
    }
    .mto-clock { font-weight: 600; color: var(--primary); font-size: 15px; }

    .mto-erp-log {
      background: var(--card); border-radius: var(--radius);
      padding: 20px; margin-top: 20px;
      max-height: 300px; overflow-y: auto;
    }
    .mto-erp-log-item {
      padding: 8px 0; border-bottom: 1px solid rgba(0,0,0,0.06);
      font-size: 14px;
    }

    .mto-transport-info {
      background: var(--card); border-radius: var(--radius);
      padding: 20px; margin-top: 20px;
    }
    .mto-transport-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 15px;
    }
    .mto-transport-stats div {
      text-align: center; padding: 12px;
      background: rgba(0,0,0,0.03); border-radius: 12px;
    }
    .mto-transport-stats span {
      display: block; font-size: 28px; font-weight: 700;
      color: var(--primary);
    }
    .mto-vehicle-tag {
      display: inline-block; padding: 4px 12px;
      border-radius: 20px; font-size: 13px; margin: 3px;
      color: #fff;
    }

    .mto-role-panel {
      background: var(--card); border-radius: var(--radius);
      padding: 20px; margin-top: 20px;
    }
    .mto-role-panel h3 { color: var(--primary); margin-bottom: 15px; }
    .mto-role-panel table { width: 100%; border-collapse: collapse; }
    .mto-role-panel th, .mto-role-panel td {
      padding: 10px; border-bottom: 1px solid rgba(0,0,0,0.06);
      text-align: left;
    }
    .mto-role-panel th { background: var(--bg); color: var(--text); }
    .mto-role-panel .btn {
      padding: 6px 14px; border: none; border-radius: 20px;
      cursor: pointer; font-size: 13px; margin: 2px;
      transition: var(--transition);
    }
    .mto-role-panel .btn:hover { opacity: 0.85; transform: scale(1.02); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-success { background: #27ae60; color: #fff; }
    .btn-warning { background: #f39c12; color: #fff; }
    .btn-danger { background: #e74c3c; color: #fff; }
    .mto-role-panel select {
      padding: 4px 8px; border-radius: 12px;
      border: 1px solid #ccc; background: var(--card);
      color: var(--text);
    }

    .mto-role-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px; margin-top: 30px;
    }
    .mto-role-card {
      background: var(--card); border-radius: var(--radius);
      padding: 20px; text-align: center;
      box-shadow: var(--shadow); cursor: pointer;
      transition: var(--transition);
    }
    .mto-role-card:hover {
      transform: scale(1.05);
      box-shadow: 0 12px 40px rgba(0,0,0,0.15);
    }
    .mto-role-card .icon { font-size: 48px; margin-bottom: 10px; }
    .mto-role-card h4 { font-size: 18px; color: var(--text); }
    .mto-role-card p { font-size: 14px; opacity: 0.7; }

    .mto-back-btn {
      background: var(--card); border: 1px solid #ccc;
      border-radius: 30px; padding: 8px 20px;
      cursor: pointer; font-size: 14px;
      box-shadow: var(--shadow); margin-bottom: 20px;
      transition: var(--transition);
    }
    .mto-back-btn:hover {
      background: var(--primary); color: #fff;
      border-color: var(--primary);
    }

    .org-node { margin: 10px 0; text-align: center; }
    .org-title {
      background: var(--primary); color: #fff;
      padding: 10px 20px; border-radius: 8px;
      display: inline-block; font-size: 16px; margin: 5px;
    }
    .org-children {
      display: flex; flex-wrap: wrap;
      justify-content: center; gap: 15px;
      padding-top: 15px;
      border-top: 2px solid #90a4ae;
    }

    .mto-footer {
      text-align: center; padding: 30px;
      background: var(--card); margin-top: 40px;
      color: var(--text); font-size: 14px;
    }
    .mto-footer span { opacity: 0.6; }

    @media (max-width: 768px) {
      .mto-section { padding: 40px 12px; }
      .mto-nav { padding: 8px 12px; gap: 6px; }
      .mto-nav a { font-size: 12px; padding: 4px 10px; }
      .mto-section h2 { font-size: 28px; }
      .mto-grid { grid-template-columns: 1fr; }
      .mto-stats { grid-template-columns: repeat(2, 1fr); }
      .mto-map { height: 350px; }
      .mto-notif { width: 90%; right: 5%; bottom: 10px; }
      .mto-3d { height: 350px; }
    }
    @media (max-width: 480px) {
      .mto-nav a { font-size: 11px; padding: 3px 8px; }
      .mto-stats { grid-template-columns: 1fr; }
      .mto-kpi-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
