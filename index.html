    .mto-loader { position: fixed; top:0; left:0; width:100%; height:100%; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9999; transition: opacity 0.5s; }
    .mto-loader .spinner { width:48px; height:48px; border:5px solid rgba(0,0,0,0.1); border-top-color:var(--primary); border-radius:50%; animation: spin 0.8s linear infinite; }

    .mto-loader p { margin-top:16px; font-size:18px; color:var(--text); }
    .mto-nav { position:sticky; top:0; background:var(--card); box-shadow:0 2px 16px rgba(0,0,0,0.06); padding:12px 20px; z-index:100; display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; justify-content:center; }
    .mto-nav a { color:var(--text); text-decoration:none; font-weight:600; padding:6px 14px; border-radius:30px; transition:var(--transition); font-size:14px; cursor:pointer; white-space:nowrap; }
    .mto-nav a:hover, .mto-nav a:focus { background:var(--primary); color:#fff; }
    .mto-section { padding:60px 20px; max-width:1400px; margin:0 auto; display:none; }
    .mto-section.active { display:block; }
    .mto-section h2 { font-size:36px; margin-bottom:30px; color:var(--primary); text-align:center; font-weight:700; }
    .mto-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px,1fr)); gap:25px; }
    .mto-card { background:var(--card); border-radius:var(--radius); padding:25px; box-shadow:var(--shadow); transition:var(--transition); }
    .mto-card:hover { transform:translateY(-4px); box-shadow:0 12px 40px rgba(0,0,0,0.12); }
    .mto-card h3 { font-size:20px; margin-bottom:12px; color:var(--text); }
    .mto-card p, .mto-card li { font-size:15px; color:var(--text); opacity:0.9; }
    .mto-card ul { list-style:none; padding:0; }
    .mto-card ul li { padding:4px 0; border-bottom:1px solid rgba(0,0,0,0.05); }
    .mto-stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:20px; margin-top:30px; }
    .mto-stat { background:var(--card); border-radius:var(--radius); padding:20px; text-align:center; box-shadow:var(--shadow); }
    .mto-stat h1 { font-size:42px; color:var(--primary); font-weight:700; }
    .mto-stat p { font-size:16px; opacity:0.8; }
    .mto-chart-container { height:280px; margin:16px 0; }
    .mto-map { height:500px; border-radius:var(--radius); overflow:hidden; background:var(--card); }
    .mto-3d { height:500px; border-radius:var(--radius); overflow:hidden; background:var(--card); }
    .mto-progress { height:12px; background:#e0e0e0; border-radius:20px; overflow:hidden; margin-top:8px; }
    .mto-progress-bar { height:100%; background:var(--primary); transition:width 0.5s; }
    .mto-kpi-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:15px; }
    .mto-kpi-item { background:var(--card); border-radius:var(--radius); padding:16px; text-align:center; box-shadow:var(--shadow); }
    .mto-kpi-item h4 { font-size:14px; opacity:0.7; margin-bottom:4px; }
    .mto-kpi-item .value { font-size:28px; font-weight:700; color:var(--primary); }

    @media (max-width:768px) { .mto-section { padding:40px 12px; } .mto-nav { padding:8px 12px; gap:6px; } .mto-nav a { font-size:12px; padding:4px 10px; } .mto-section h2 { font-size:28px; } .mto-grid { grid-template-columns:1fr; } .mto-stats { grid-template-columns:repeat(2,1fr); } .mto-map { height:350px; } .mto-notif { width:90%; right:5%; bottom:10px; } .mto-3d { height:350px; } }

    // ---------- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ----------
    function sumObject(obj) {
      let s = 0;
      Object.values(obj).forEach(v => s += v);
      return s;
    }
    const totalInvestment = sumObject(DATA.finance.investments);
    const annualSaving = sumObject(DATA.finance.saving);
    const payback = Math.ceil(totalInvestment / annualSaving);
    const forecast = [];
    let acc = 0;
    for (let y = 2026; y <= 2035; y++) {
      acc += annualSaving;
      forecast.push({ year: y, saving: annualSaving, total: acc });
    }

    function calcStaff(node) {
      if (node.count) return node.count;
      if (node.children) {
        let c = 0;
        node.children.forEach(ch => c += calcStaff(ch));
        return c;
      }
      return 1;
    }
    function calcFOT(node) {
      let r = 0;
      if (node.salary) r += (node.count || 1) * node.salary;
      if (node.children) node.children.forEach(ch => r += calcFOT(ch));
      return r;
    }
    const staffCount = calcStaff(DATA.structure);
    const monthlyFOT = calcFOT(DATA.structure);

    function calcRoute(r) {
      let f = r.distance * 0.18;
      return { distance: r.distance, time: r.deliveryTime, fuel: f.toFixed(1), cost: Math.round(f * 65) };
    }
    function optimizeRoutes() {
      return DATA.transport.routes.map(r => {
        const res = calcRoute(r);
        return { point: r.name, time: res.time, cost: res.cost };
      }).sort((a, b) => a.time - b.time);
    }

    let erpPurchases = [];
    let erpLog = [];
    function findSupplier(cat) {
      const s = DATA.erp.suppliers.find(i => i.category === cat);
      return s ? s.name : 'Выбор поставщика';
    }
    function createPurchaseERP(mat) {
      const p = {
        id: 'PUR-' + Date.now(),
        material: mat.name,
        quantity: mat.min * 2,
        supplier: findSupplier(mat.category),
        status: 'На согласовании',
        date: new Date()
      };
      erpPurchases.push(p);
      return p;
    }
    function receiveMaterialERP(id, amt) {
      const item = DATA.erp.stock.find(x => x.id === id);
      if (!item) return;
      item.quantity += amt;
      erpLog.push({ time: new Date().toLocaleString('ru-RU'), action: 'Приемка', description: `${item.name} +${amt}` });
    }
    function issueMaterialERP(id, amt, dept) {
      const item = DATA.erp.stock.find(x => x.id === id);
      if (!item) return;
      if (item.quantity >= amt) {
        item.quantity -= amt;
        erpLog.push({ time: new Date().toLocaleString('ru-RU'), action: 'Выдача', description: `${item.name} -> ${dept}` });

        console.warn('Недостаточно запасов');

    }
    function ERPStatistics() {
      return {
        materials: DATA.erp.stock.length,
        totalStockValue: DATA.erp.stock.reduce((s, i) => s + i.quantity * i.price, 0),
        requests: DATA.erp.requests.length,
        purchases: erpPurchases.length,
        operations: erpLog.length
      };
    }

    issueMaterialERP(1, 150, 'Участок №2');

    // Функции ролей
    function getAvailableVehicles() {
      return DATA.transport.fleet.filter(v => v.status === 'Свободна' || v.status === 'Свободен');
    }
    function assignVehicleToRequest(requestId, vehicleId) {
      const req = DATA.requests.find(r => r.id === requestId);
      if (!req) return false;
      const vehicle = DATA.transport.fleet.find(v => v.id === vehicleId);
      if (!vehicle || (vehicle.status !== 'Свободна' && vehicle.status !== 'Свободен')) return false;
      req.status = 'Назначен транспорт';
      req.assignedVehicle = vehicleId;
      vehicle.status = 'Занят';
      return true;
    }
    function completeDelivery(requestId) {
      const req = DATA.requests.find(r => r.id === requestId);
      if (!req) return false;
      if (req.assignedVehicle) {
        const vehicle = DATA.transport.fleet.find(v => v.id === req.assignedVehicle);
        if (vehicle) vehicle.status = 'Свободна';
      }
      req.status = 'Доставлено';
      req.assignedVehicle = null;
      return true;
    }
    function assignTeam(alertId, teamId) {
      const alert = DATA.emergency.alerts.find(a => a.id === alertId);
      if (!alert) return false;
      const team = DATA.emergency.teams.find(t => t.id === teamId);
      if (!team || team.status !== 'Свободна') return false;
      alert.status = 'В работе';
      alert.assigned = teamId;
      team.status = 'На выезде';
      return true;
    }
    function resolveAlert(alertId) {
      const alert = DATA.emergency.alerts.find(a => a.id === alertId);
      if (!alert) return false;
      alert.status = 'Решена';
      const team = DATA.emergency.teams.find(t => t.id === alert.assigned);
      if (team) team.status = 'Свободна';
      return true;
    }
    function completeTask(taskId) {
      const task = DATA.technical.tasks.find(t => t.id === taskId);
      if (!task) return false;
      task.status = 'Выполнена';
      const eq = DATA.technical.equipment.find(e => e.name === task.equipment);
      if (eq) {
        eq.lastMaintenance = new Date().toISOString().slice(0, 10);
        const d = new Date();
        d.setMonth(d.getMonth() + 3);
        eq.nextMaintenance = d.toISOString().slice(0, 10);
      }
      return true;
    }
    function getTransportReport() {
      const fleet = DATA.transport.fleet;
      return {
        total: fleet.length,
        available: fleet.filter(v => v.status === 'Свободна' || v.status === 'Свободен').length,
        inUse: fleet.filter(v => v.status === 'Доставка' || v.status === 'Занят').length,
        inRepair: fleet.filter(v => v.status === 'Ремонт').length
      };
    }
    function getAdminStats() {
      return {
        staff: staffCount,
        monthlyFOT: monthlyFOT,
        requests: DATA.requests.length,
        stockItems: DATA.materials.reduce((s, m) => s + m.stock, 0),
        vehicles: DATA.transport.fleet.length,
        emergencies: DATA.emergency.alerts.filter(a => a.status !== 'Решена').length
      };
    }
    function getStockSummary() {
      return DATA.materials.map(m => ({ ...m, percent: Math.round((m.stock / m.minStock) * 100) }));
    }
    function getHousingStats() {
      return {
        totalAreas: DATA.areas.length,
        activeRequests: DATA.requests.filter(r => r.status !== 'Доставлено' && r.status !== 'Выполнена').length,
        completedRequests: DATA.requests.filter(r => r.status === 'Доставлено' || r.status === 'Выполнена').length,
        emergencyAlerts: DATA.emergency.alerts.filter(a => a.status !== 'Решена').length

    }
    function getAreaRequests(areaName) {

    function initWarehouseManager() {

      if (!container) return;
      function render() {
        let html = `<h3>Остатки материалов</h3><table><tr><th>Название</th><th>Остаток</th><th>Мин.</th><th>Загрузка</th></tr>`;
        DATA.materials.forEach(m => {

          const color = pct > 80 ? '#4caf50' : pct > 50 ? '#f39c12' : '#e74c3c';
          html += `<tr><td>${m.name}</td><td>${m.stock} ${m.unit}</td><td>${m.minStock}</td><td><div style="background:#e0e0e0;border-radius:10px;height:16px;width:100%;"><div style="height:100%;width:${pct}%;background:${color};border-radius:10px;"></div></div></td></tr>`;
        });
        html += `</table><h3 style="margin-top:20px;">Создать заявку на выдачу</h3>
          <select id="whMatSelect">${DATA.materials.map(m => `<option value="${m.id}">${m.name}</option>`).join('')}</select>
          <input type="number" id="whQuantity" placeholder="Кол-во" style="padding:6px;border-radius:12px;border:1px solid #ccc;width:100px;margin:0 10px;">

          <button class="btn btn-primary" onclick="window._createStockReq()">Создать</button>`;
        container.innerHTML = html;
        window._createStockReq = function() {
          const matId = parseInt(document.getElementById('whMatSelect').value);
          const qty = parseInt(document.getElementById('whQuantity').value);
          const dept = document.getElementById('whDepartment').value || 'Складской запрос';
          if (!qty || qty <= 0) { alert('Введите количество'); return; }
          const mat = DATA.materials.find(m => m.id === matId);
          if (!mat) return;
          if (mat.stock < qty) { alert('Недостаточно материала'); return; }
          DATA.requests.push({ id: Date.now(), department: dept, material: mat.name, quantity: qty, priority: 'Нормальная', status: 'Новая', assignedVehicle: null });
          mat.stock -= qty;
          render();
          alert('Заявка создана');
        };
      }
      render();
    }

    function init3D() {
      if (inited.d3) return;
      inited.d3 = true;
      const container = document.getElementById('warehouse3dContainer');
      if (!container || typeof import === 'undefined') return;
      import('https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js')
        .then(THREE => import('https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/controls/OrbitControls.js')
          .then(module => {
            const OrbitControls = module.OrbitControls;
            const scene = new THREE.Scene(); scene.background = new THREE.Color(0xe8f1f8);
            const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 5000);
            camera.position.set(80,90,120);
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);
            const controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; controls.maxDistance = 400; controls.minDistance = 30;
            const ambient = new THREE.AmbientLight(0xffffff, 0.7); scene.add(ambient);
            const light = new THREE.DirectionalLight(0xffffff, 1); light.position.set(50,120,40); light.castShadow = true; scene.add(light);
            const ground = new THREE.Mesh(new THREE.PlaneGeometry(300,250), new THREE.MeshStandardMaterial({ color: 0x8bc34a }));
            ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);
            const building = new THREE.Mesh(new THREE.BoxGeometry(120,18,70), new THREE.MeshStandardMaterial({ color: 0xffffff }));
            building.position.y = 9; building.castShadow = true; scene.add(building);
            function addZone(x,z,c) { const zz = new THREE.Mesh(new THREE.BoxGeometry(20,0.3,20), new THREE.MeshStandardMaterial({ color: c })); zz.position.set(x,18.2,z); scene.add(zz); }
            addZone(-35,0,0x2196f3); addZone(0,0,0xff9800); addZone(35,0,0x9c27b0); addZone(0,25,0x009688);
            function addRack(x,z) { const g = new THREE.Group(); for (let i=0; i<5; i++) { const s = new THREE.Mesh(new THREE.BoxGeometry(12,0.5,3), new THREE.MeshStandardMaterial({ color: 0x455a64 })); s.position.y = i*3; g.add(s); } g.position.set(x,1,z); g.castShadow = true; scene.add(g); }
            for (let x=-45; x<=45; x+=15) for (let z=-25; z<=25; z+=15) addRack(x,z);
            const office = new THREE.Mesh(new THREE.BoxGeometry(20,8,15), new THREE.MeshStandardMaterial({ color: 0xeeeeee })); office.position.set(45,4,25); scene.add(office);
            const repair = new THREE.Mesh(new THREE.BoxGeometry(30,10,25), new THREE.MeshStandardMaterial({ color: 0xffcc80 })); repair.position.set(-55,5,35); scene.add(repair);
            function addVeh(x,z) { const car = new THREE.Group(); const body = new THREE.Mesh(new THREE.BoxGeometry(6,2,3), new THREE.MeshStandardMaterial({ color: 0xffeb3b })); body.position.y=2; car.add(body); const cab = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), new THREE.MeshStandardMaterial({ color: 0x333333 })); cab.position.set(0,4,0); car.add(cab); car.position.set(x,0,z); scene.add(car); return car; }
            const loader = addVeh(-20,40); const truck = addVeh(25,45);
            let angle = 0;
            function anim() { angle += 0.01; loader.position.x = Math.sin(angle)*25; truck.position.z = 40 + Math.cos(angle)*15; }
            function render() { requestAnimationFrame(render); anim(); controls.update(); renderer.render(scene,camera); }
            render();
            window.addEventListener('resize', () => {
              camera.aspect = container.clientWidth / container.clientHeight;
              camera.updateProjectionMatrix();
              renderer.setSize(container.clientWidth, container.clientHeight);
            });
          })
        ).catch(err => console.error('3D error', err));
    }

    function initDashboard() {
      if (inited.dash) return;
      inited.dash = true;
      let storageCap = 6000, storageUsed = 3720;
      let vehTotal = 148, vehOnline = 137;
      let reqToday = 184, reqDone = 176;
      let items = 4128;
      let budgetTotal = 28500000, budgetSpent = 21340000;
      let procCount = 58, delayed = 4;

      function update() {
        const sp = Math.round(storageUsed/storageCap*100);
        const vp = Math.round(vehOnline/vehTotal*100);
        const rp = Math.round(reqDone/reqToday*100);
        const bp = Math.round(budgetSpent/budgetTotal*100);
        document.getElementById('dashStorage').textContent = sp+'%';
        document.getElementById('dashStorageBar').style.width = sp+'%';
        document.getElementById('dashTransport').textContent = vp+'%';
        document.getElementById('dashTransportBar').style.width = vp+'%';
        document.getElementById('dashRequests').textContent = rp+'%';
        document.getElementById('dashRequestsBar').style.width = rp+'%';
        document.getElementById('dashBudget').textContent = bp+'%';
        document.getElementById('dashBudgetBar').style.width = bp+'%';
        document.getElementById('dashArea').textContent = storageUsed+' м²';
        document.getElementById('dashFree').textContent = (storageCap-storageUsed)+' м²';
        document.getElementById('dashItems').textContent = items;
        document.getElementById('dashProcurements').textContent = procCount;
        document.getElementById('dashDelayed').textContent = delayed;
      }
      function simulate() {
        storageUsed += Math.floor(Math.random()*30)-10;
        reqToday += Math.floor(Math.random()*4);
        reqDone += Math.floor(Math.random()*3);
        vehOnline += Math.floor(Math.random()*3)-1;
        if (vehOnline > vehTotal) vehOnline = vehTotal;
        if (vehOnline < 130) vehOnline = 130;
        budgetSpent += Math.floor(Math.random()*40000);
        update();
      }

      setInterval(simulate, 3000);

          <div class="mto-card"><h3>Годовая экономия</h3><h1>${(annualSaving/1000000).toFixed(0)} млн ₽</h1></div>
          <div class="mto-card"><h3>Окупаемость</h3><h1>${payback} лет</h1></div>
          <div class="mto-card"><h3>Эффект за 10 лет</h3><h1>${(annualSaving*10/1000000).toFixed(0)} млн ₽</h1></div>
        `;
      }
      const canvas = document.getElementById('financeChart');
      if (canvas && typeof Chart !== 'undefined') {
        new Chart(canvas, {
          type: 'line',
          data: {
            labels: forecast.map(f => f.year),
            datasets: [{ label: 'Накопленный эффект, млн ₽', data: forecast.map(f => (f.total/1000000).toFixed(1)), fill: true, tension: 0.4 }]
          },
          options: { responsive: true, maintainAspectRatio: false }
        });
      }
      const comp = document.getElementById('comparisonGrid');
      if (comp) {
        comp.innerHTML = '';
        Object.keys(DATA.beforeAfter.before).forEach(key => {
          const div = document.createElement('div'); div.className = 'mto-card';
          div.innerHTML = `<h3>${key}</h3><p>До: ${DATA.beforeAfter.before[key]} млн ₽</p><p>После: ${DATA.beforeAfter.after[key]} млн ₽</p>`;
          comp.appendChild(div);
        });
      }
      window.MTO_FINANCE = { investment: totalInvestment, saving: annualSaving, payback, forecast };
    }

    function initTransport() {
      if (inited.tr) return;
      inited.tr = true;
      const info = document.getElementById('transportInfo');
      if (!info) return;
      const fleet = DATA.transport.fleet;
      const available = fleet.filter(v => v.status === 'Свободна' || v.status === 'Свободен').length;
      const avgTime = Math.round(DATA.transport.routes.reduce((a,b) => a + b.deliveryTime, 0) / DATA.transport.routes.length);
      const opt = optimizeRoutes();
      info.innerHTML = `
        <h3>🚛 Транспортный участок</h3>
        <div class="mto-transport-stats">
          <div><span>${fleet.length}</span><small>Автомобилей</small></div>
          <div><span>${available}</span><small>Свободно</small></div>
          <div><span>${avgTime} мин</span><small>Среднее время доставки</small></div>
          <div><span>18%</span><small>Экономия топлива</small></div>
        </div>
        <div style="margin-top:15px;"><b>Маршруты (оптимизированы)</b>
          <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;">
            ${opt.map(r => `<span style="background:var(--card);padding:6px 14px;border-radius:12px;box-shadow:var(--shadow);">${r.point} — ${r.time} мин (${r.cost} ₽)</span>`).join('')}
          </div>
        </div>
        <div style="margin-top:15px;"><b>Ворота</b>
          <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;">
            ${DATA.transport.gates.map(g => `<span style="background:${g.status==='Свободны'?'#4caf50':'#e74c3c'};color:#fff;padding:4px 12px;border-radius:20px;font-size:13px;">Ворота ${g.id} — ${g.status}</span>`).join('')}
          </div>
        </div>
        <div style="margin-top:15px;"><b>Автопарк</b>
          <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;">
            ${fleet.map(v => `<span class="mto-vehicle-tag" style="background:${v.status==='Свободна'||v.status==='Свободен'?'#4caf50':v.status==='Доставка'?'#f39c12':'#e74c3c'};">${v.id} (${v.type})</span>`).join('')}
          </div>
        </div>
      `;
      window.MTO_TRANSPORT = { fleet, routes: DATA.transport.routes, gates: DATA.transport.gates, KPI: { fleet: fleet.length, available, avgTime, fuelSaving: '18%' } };
    }

    function initERP() {
      if (inited.erp) return;
      inited.erp = true;
      const panel = document.getElementById('erpPanel');
      const logBox = document.getElementById('erpLog');
      if (!panel || !logBox) return;
      const stat = ERPStatistics();
      panel.innerHTML = `
        <div class="mto-card"><h3>Материалы</h3><h1>${stat.materials}</h1></div>
        <div class="mto-card"><h3>Стоимость запасов</h3><h1>${stat.totalStockValue.toLocaleString('ru-RU')} ₽</h1></div>
        <div class="mto-card"><h3>Заявки</h3><h1>${stat.requests}</h1></div>
        <div class="mto-card"><h3>Закупки</h3><h1>${stat.purchases}</h1></div>
      `;
      logBox.innerHTML = '<h3 style="margin-bottom:10px;">Журнал операций (последние 5)</h3>';
      erpLog.slice(-5).reverse().forEach(e => {
        const d = document.createElement('div'); d.className = 'mto-erp-log-item';
        d.textContent = e.time + ' — ' + e.action + ': ' + e.description;
        logBox.appendChild(d);
      });
      window.MTO_ERP = { users: DATA.erp.users, stock: DATA.erp.stock, requests: DATA.erp.requests, purchases: erpPurchases, suppliers: DATA.erp.suppliers, log: erpLog, statistics: ERPStatistics };
    }

    // ---------- КАРТА РЕАЛЬНОГО ВРЕМЕНИ ----------
    let realtimeMap = null, mapMarkers = [], mapInterval = null;

    function initRealtimeMap() {
      if (inited.realtime || typeof ymaps === 'undefined') return;
      inited.realtime = true;
      ymaps.ready(() => {
        realtimeMap = new ymaps.Map('realtimeMap', {
          center: [55.735, 37.404],
          zoom: 13,
          controls: ['zoomControl', 'fullscreenControl']
        });
        DATA.areas.forEach(area => {
          const pm = new ymaps.Placemark(area.coords, { balloonContent: `<b>${area.name}</b><br>${area.address}`, hintContent: area.name }, { preset: 'islands#greenDotIcon' });
          realtimeMap.geoObjects.add(pm);
          mapMarkers.push(pm);
        });
        DATA.transport.fleet.forEach((v, idx) => {
          const coords = [55.735 + (idx * 0.002), 37.403 + (idx * 0.002)];
          const pm = new ymaps.Placemark(coords, { hintContent: v.id + ' (' + v.type + ')' }, { preset: 'islands#blueTruckIcon' });
          realtimeMap.geoObjects.add(pm);
          mapMarkers.push(pm);
        });
        let step = 0;
        if (mapInterval) clearInterval(mapInterval);
        mapInterval = setInterval(() => {
          step += 0.01;
          DATA.transport.fleet.forEach((v, idx) => {
            if (v.status === 'Доставка' || v.status === 'Занят') {
              const baseLat = 55.735 + (idx * 0.002);
              const baseLon = 37.403 + (idx * 0.002);
              const lat = baseLat + Math.sin(step + idx) * 0.01;
              const lon = baseLon + Math.cos(step + idx) * 0.01;
              const marker = mapMarkers[mapMarkers.length - DATA.transport.fleet.length + idx];
              if (marker) marker.geometry.setCoordinates([lat, lon]);
            }
          });
        }, 2000);
        document.getElementById('realtimeRefresh')?.addEventListener('click', () => {
          DATA.transport.fleet.forEach((v, idx) => {
            const marker = mapMarkers[mapMarkers.length - DATA.transport.fleet.length + idx];
            if (marker) {
              const lat = 55.735 + (idx * 0.002) + (Math.random() - 0.5) * 0.02;
              const lon = 37.403 + (idx * 0.002) + (Math.random() - 0.5) * 0.02;
              marker.geometry.setCoordinates([lat, lon]);
            }
          });
        });
      });
    }

    // ---------- ЗАГРУЗКА ЗАВИСИМОСТЕЙ ----------
    function loadDependencies(callback) {
      let loaded = 0;
      const total = 2;
      const onLoad = () => { loaded++; if (loaded === total) callback(); };
      if (typeof Chart !== 'undefined') {
        loaded++;
      } else {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/chart.js';
        s.onload = onLoad;
        s.onerror = onLoad;
        document.head.appendChild(s);
      }
      if (typeof ymaps !== 'undefined') {
        loaded++;
      } else {
        const s = document.createElement('script');
        s.src = `https://api-maps.yandex.ru/2.1/?apikey=${CFG.YANDEX_KEY}&lang=ru_RU`;
        s.onload = onLoad;
        s.onerror = onLoad;
        document.head.appendChild(s);
      }
      if (loaded === total) callback();
    }

    // ---------- ЗАПУСК ----------
    function initApp() {
      const container = document.getElementById(CFG.CONTAINER);
      if (!container) return;
      initCharts();
      initMap();
      initGIS();
      initOrganization();
      initLogistics();
      initMasterplan();
      initDashboard();
      initFinance();
      initTransport();
      initERP();
      initRealtimeMap();
      init3D();

      // Навигация
      document.querySelectorAll('.mto-nav a[data-section]').forEach(link => {
        link.addEventListener('click', function(e) {
          e.preventDefault();
          const section = this.dataset.section;
          if (section === 'main') { showMain(); return; }
          showSection(section);
        });
      });
      document.querySelectorAll('.mto-role-card').forEach(card => {
        card.addEventListener('click', function() {
          showRole(this.dataset.role);
        });
      });
      const loader = document.getElementById(CFG.LOADER);
      if (loader) loader.style.display = 'none';
      console.log(`Приложение МТО v${CFG.VERSION} загружено`);
    }

    // ---------- СОЗДАНИЕ HTML ----------
    function createApp() {
      const app = document.getElementById(CFG.APP_ID);
      if (!app) return;
      app.innerHTML = buildHTML();
      loadDependencies(initApp);
    }

    // ---------- СТАРТ ----------
    if (document.readyState === 'complete') createApp();
    else document.addEventListener('DOMContentLoaded', createApp);

  </script>
</body>
</html>
